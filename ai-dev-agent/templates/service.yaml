apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-dev-agent.fullname" . }}
  labels:
    {{- include "ai-dev-agent.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP

  selector:
    {{- include "ai-dev-agent.selectorLabels" . | nindent 4 }}

