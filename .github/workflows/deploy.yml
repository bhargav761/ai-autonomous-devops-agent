name: Deploy Flask App to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get latest code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connect to EC2 and deploy
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ai-autonomous-devops-agent
            git pull origin master

            docker stop ai-dev-agent || true
            docker rm ai-dev-agent || true

            docker build -t ai-dev-agent ./app/backend
            docker run -d -p 8080:8080 --name ai-dev-agent ai-dev-agent
